<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Convertisseur de {{ label }}</title></head>
<body>
  <h1>Convertisseur de {{ label }}</h1>
  <form method="GET" action="{{ url_for('web.convert', family=family) }}">
    <input name="value" value="{{ value or '' }}" required>
    <select name="from">
      {% for u in units %}<option value="{{ u }}" {% if u == from_unit %}selected{% endif %}>{{ u }}</option>{% endfor %}
    </select>
    <select name="to">
      {% for u in units %}<option value="{{ u }}" {% if u == to_unit %}selected{% endif %}>{{ u }}</option>{% endfor %}
    </select>
    <button type="submit">Convertir</button>
  </form>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  {% if result is defined %}<p>{{ value }} {{ from_unit }} = {{ result }} {{ to_unit }}</p>{% endif %}
</body>
</html>
